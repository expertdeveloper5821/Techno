name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  workflow_dispatch:

jobs:
  claude-review:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ✅ PR-based review (diff only)
      - name: Run Claude Code Review (PR)
        if: github.event_name == 'pull_request'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: >
            /code-review:code-review
            ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

      # ✅ Full repo review (ONLY src/)
      - name: Run Claude Full Repo Review (Manual)
        if: github.event_name == 'workflow_dispatch'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: |
            /code-review:code-review src/

            Focus on:
            - bugs
            - security issues
            - performance problems
            - code quality
            - architecture

            Ignore:
            - node_modules
            - build artifacts
            - generated files

            Provide a structured report with:
            - Critical issues
            - Warnings
            - Suggestions
